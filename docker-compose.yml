version: '3.8'

services:
  webserver:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: ci3_app
    ports:
      - "${APP_PORT:-9090}:80"
    volumes:
      - ./:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/php.ini
    depends_on:
      - database
    networks:
      - codeigniter-network

  database:
    image: mysql:8.0
    container_name: ci3_db
    ports:
      - "${DB_PORT:-3307}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: sistema_app
      MYSQL_USER: devcash
      MYSQL_PASSWORD: 1234
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/my.cnf
      - ./database:/docker-entrypoint-initdb.d
    networks:
      - codeigniter-network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: ci3_phpmyadmin
    ports:
      - "${PMA_PORT:-9091}:80"
    environment:
      PMA_HOST: database
      PMA_PORT: 3306
      UPLOAD_LIMIT: ${UPLOAD_LIMIT:-500M}
    depends_on:
      - database
    networks:
      - codeigniter-network

volumes:
  db_data:

networks:
  codeigniter-network:
    driver: bridge